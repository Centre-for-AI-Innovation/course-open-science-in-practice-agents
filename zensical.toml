[project]
site_name = "Open Science in Practice: Responsible use of agentic AI in research"
site_description = "Course docs for K8F6133 (KI, spring 2027)"
repo_url = "https://github.com/Centre-for-AI-Innovation/course-open-science-in-practice-agents"
edit_uri = "edit/main/docs/"
site_url = "https://Centre-for-AI-Innovation.github.io/course-open-science-in-practice-agents"
docs_dir = "docs"
nav = [
  { "Home" = "index.md" },
  { "Schedule" = "schedule.md" },
  {"Content" = "content/index.md"}
]
watch = ["docs/schedule.csv"]

[project.theme]
variant = "classic"
features = [
  "navigation.top",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.footer",
  "navigation.sections",
  "toc.follow",
  "toc.integrate",
  "content.code.copy",
  "content.code.annotate",
  "content.action.edit",
  "content.action.view",
  "search.suggest",
  "search.highlight",
  "search.share",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
primary = "black"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
primary = "black"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.plugins.table-reader]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.emoji" = {
  emoji_index = "zensical.extensions.emoji.twemoji",
  emoji_generator = "zensical.extensions.emoji.to_svg",
}
"toc" = { permalink = true, toc_depth = 2 }
